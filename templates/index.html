<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Scanner</title>
<style>
/* ── Reset & Variables ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #131722;
  --bg2:       #1e222d;
  --bg3:       #2a2e39;
  --border:    #363a45;
  --txt:       #d1d4dc;
  --txt2:      #787b86;
  --txt3:      #4f5360;
  --green:     #26a69a;
  --green2:    #4caf50;
  --red:       #ef5350;
  --blue:      #2962ff;
  --yellow:    #f5c842;
  --purple:    #9c27b0;
  --orange:    #ff9800;
  --cyan:      #64b5f6;
  --font:      'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: var(--font); font-size: 12px; }

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────────────────────── */
#topbar {
  height: 46px; min-height: 46px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  flex-shrink: 0; z-index: 10;
}
.logo { font-weight: 700; font-size: 14px; color: var(--txt); white-space: nowrap; letter-spacing: .5px; }
.logo span { color: var(--blue); }
#etf-input {
  background: var(--bg3); border: 1px solid var(--border); color: var(--txt);
  border-radius: 4px; padding: 6px 10px; font-size: 13px; width: 220px;
  outline: none; transition: border-color .15s;
}
#etf-input:focus { border-color: var(--blue); }
#scan-btn {
  background: var(--blue); color: #fff; border: none; border-radius: 4px;
  padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  white-space: nowrap; transition: opacity .15s;
}
#scan-btn:disabled { opacity: .5; cursor: default; }
#scan-btn:not(:disabled):hover { opacity: .85; }
#scan-status { color: var(--txt2); font-size: 11px; flex: 1; }
#tf-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-left: auto; flex-shrink: 0; }
.tf-btn {
  background: transparent; color: var(--txt2); border: none; padding: 5px 12px;
  font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
}
.tf-btn:hover { background: var(--bg3); color: var(--txt); }
.tf-btn.active { background: var(--blue); color: #fff; }

/* ── Main Layout ─────────────────────────────────────────────────────────── */
#main-layout {
  display: grid;
  grid-template-columns: 260px 1fr 280px;
  height: calc(100vh - 46px);
  overflow: hidden;
}
.side-panel {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}
#right-panel { border-right: none; border-left: 1px solid var(--border); }

/* ── Centre Panel ────────────────────────────────────────────────────────── */
#center-panel {
  display: flex; flex-direction: column;
  background: var(--bg); overflow: hidden;
}
#chart-header {
  height: 36px; min-height: 36px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 12px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  font-size: 12px; flex-shrink: 0;
}
#ch-ticker  { font-size: 16px; font-weight: 700; color: var(--txt); }
#ch-name    { color: var(--txt2); }
#ch-price   { font-weight: 700; margin-left: auto; }
#ch-ohlcv   { color: var(--txt2); font-size: 11px; margin-left: 8px; }
#chart-main { flex: 1; min-height: 0; }
#rsi-divider {
  height: 22px; min-height: 22px;
  display: flex; align-items: center; padding: 0 10px; gap: 8px;
  background: var(--bg2); border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#rsi-divider span { font-size: 11px; color: var(--purple); font-weight: 600; }
#chart-rsi { height: 120px; min-height: 120px; flex-shrink: 0; }

/* ── Placeholder ─────────────────────────────────────────────────────────── */
.placeholder {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--txt3); gap: 10px; text-align: center; padding: 20px;
}
.placeholder-icon { font-size: 36px; opacity: .4; }

/* ── Section title ───────────────────────────────────────────────────────── */
.sec-title {
  font-size: 10px; font-weight: 700; letter-spacing: .8px;
  color: var(--txt3); padding: 10px 12px 4px;
  text-transform: uppercase;
}

/* ── Company header (left panel) ─────────────────────────────────────────── */
#company-header {
  padding: 14px 12px 10px;
  border-bottom: 1px solid var(--border);
}
.c-ticker { font-size: 20px; font-weight: 800; color: var(--txt); }
.c-name   { font-size: 12px; color: var(--txt2); margin-top: 2px; line-height: 1.3; }
.c-price  { font-size: 22px; font-weight: 700; margin-top: 6px; }
.c-setup  {
  display: inline-block; margin-top: 6px;
  padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700;
}

/* ── Info rows ───────────────────────────────────────────────────────────── */
.info-block { padding: 4px 12px 8px; border-bottom: 1px solid var(--border); }
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; min-height: 22px;
}
.info-label { color: var(--txt2); flex-shrink: 0; margin-right: 8px; }
.info-val   { color: var(--txt); text-align: right; word-break: break-word; }
.info-val.green  { color: var(--green); }
.info-val.red    { color: var(--red); }
.info-val.yellow { color: var(--yellow); }
.info-val.orange { color: var(--orange); }
.info-val.cyan   { color: var(--cyan); }

/* ── Score bars ──────────────────────────────────────────────────────────── */
.score-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.overall-score { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.score-row-label { width: 80px; color: var(--txt2); flex-shrink: 0; }
.score-row-val   { width: 28px; text-align: right; color: var(--txt); flex-shrink: 0; }
.bar-bg { flex: 1; background: var(--bg3); border-radius: 2px; height: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }

/* ── EPS beat dots ───────────────────────────────────────────────────────── */
.beat-dot { font-size: 14px; margin-right: 1px; }
.beat-dot.hit  { color: var(--green); }
.beat-dot.miss { color: var(--txt3); }

/* ── Description ─────────────────────────────────────────────────────────── */
.description { color: var(--txt2); line-height: 1.5; padding: 8px 12px 12px; font-size: 11px; }

/* ── Sector header (right panel) ─────────────────────────────────────────── */
#sector-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.s-etf    { font-size: 22px; font-weight: 800; }
.s-name   { font-size: 12px; color: var(--txt2); margin-top: 2px; }
.s-sentiment {
  margin-top: 8px; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.s-score  { color: var(--txt2); font-size: 11px; }
.metric-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; margin-top: 10px;
}
.metric {
  background: var(--bg3); border-radius: 4px; padding: 6px 8px;
}
.metric-val   { font-weight: 700; font-size: 13px; }
.metric-label { color: var(--txt2); font-size: 10px; margin-top: 1px; }

/* ── Stock list ──────────────────────────────────────────────────────────── */
#stock-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.stock-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; cursor: pointer; border-left: 3px solid transparent;
  transition: background .1s;
}
.stock-item:hover  { background: rgba(255,255,255,.04); }
.stock-item.active { background: rgba(41,98,255,.12); border-left-color: var(--blue); }
.si-rank  { width: 18px; color: var(--txt3); text-align: right; flex-shrink: 0; }
.si-body  { flex: 1; min-width: 0; }
.si-top   { display: flex; justify-content: space-between; align-items: baseline; }
.si-ticker { font-weight: 700; font-size: 13px; }
.si-price  { font-size: 11px; color: var(--txt2); }
.si-bot   { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
.si-setup { font-size: 10px; font-weight: 600; }
.si-rating { font-size: 11px; font-weight: 700; }

/* ── Setup colours ───────────────────────────────────────────────────────── */
.setup-strong   { color: #00bcd4; }
.setup-buy      { color: var(--green); }
.setup-oversold { color: var(--cyan); }
.setup-watch    { color: var(--yellow); }
.setup-extended { color: var(--red); }
.setup-neutral  { color: var(--txt2); }

/* ── Loading spinner ─────────────────────────────────────────────────────── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--txt3); border-top-color: var(--blue);
  border-radius: 50%; animation: spin .8s linear infinite;
  vertical-align: middle;
}

/* ── Indicator toggle toolbar ────────────────────────────────────────────── */
#ind-toolbar {
  height: 28px; min-height: 28px;
  display: flex; align-items: center; gap: 4px; padding: 0 10px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ind-toggle {
  background: var(--bg3); color: var(--txt3);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 2px 8px; font-size: 10px; font-weight: 700;
  cursor: pointer; transition: all .15s; letter-spacing: .4px;
}
.ind-toggle:hover  { color: var(--txt); border-color: var(--txt2); }
.ind-toggle.active { background: #1e3a5f; color: var(--cyan); border-color: var(--blue); }

/* ── Change % in stock list ──────────────────────────────────────────────── */
.si-change { font-size: 10px; font-weight: 600; }
</style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────────────────────── -->
<div id="topbar">
  <div class="logo">SECTOR <span>SCANNER</span></div>
  <input id="etf-input" type="text" placeholder="ETF ticker: XLK, SOXX, ARKK, QQQ …" autocomplete="off" spellcheck="false">
  <button id="scan-btn">Scan</button>
  <span id="scan-status"></span>
  <div id="tf-toggle">
    <button class="tf-btn active" data-tf="daily">1D</button>
    <button class="tf-btn" data-tf="weekly">1W</button>
  </div>
</div>

<!-- ── Three-panel layout ──────────────────────────────────────────────────── -->
<div id="main-layout">

  <!-- LEFT: fundamental panel -->
  <aside class="side-panel" id="left-panel">
    <div class="placeholder" id="left-placeholder">
      <div class="placeholder-icon">📊</div>
      <div>Select a stock from the list</div>
    </div>
    <div id="left-content" style="display:none;flex-direction:column;flex:1"></div>
  </aside>

  <!-- CENTRE: chart -->
  <section id="center-panel">
    <div id="chart-header">
      <span id="ch-ticker" style="color:var(--txt2)">—</span>
      <span id="ch-name" style="color:var(--txt3)"></span>
      <span id="ch-ohlcv"></span>
      <span id="ch-price"></span>
      <span id="ch-change"></span>
    </div>
    <div id="ind-toolbar">
      <button class="ind-toggle active" data-ind="ma50">MA50</button>
      <button class="ind-toggle active" data-ind="sr">S/R</button>
      <button class="ind-toggle active" data-ind="vp">VP</button>
      <button class="ind-toggle active" data-ind="fibs">FIB</button>
      <button class="ind-toggle active" data-ind="setup">SETUP</button>
    </div>
    <div id="chart-main"></div>
    <div id="rsi-divider">
      <span>RSI(14)</span>
      <span id="rsi-val" style="color:var(--txt2);font-size:11px"></span>
    </div>
    <div id="chart-rsi"></div>
  </section>

  <!-- RIGHT: sector + stock list -->
  <aside class="side-panel" id="right-panel">
    <div class="placeholder" id="right-placeholder">
      <div class="placeholder-icon">🔍</div>
      <div>Enter an ETF ticker and click <strong>Scan</strong></div>
    </div>
    <div id="sector-header" style="display:none"></div>
    <div class="sec-title" id="stocks-title" style="display:none"></div>
    <div id="stock-list" style="display:none"></div>
  </aside>

</div>

<!-- Lightweight Charts (TradingView open-source library) -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   Sector Scanner — main UI script
   ══════════════════════════════════════════════════════════════════════════ */

const TV = LightweightCharts;
const LS = TV.LineStyle;

// ── State ──────────────────────────────────────────────────────────────────
let mainChart, rsiChart;
let candleSeries, ma50Line, volSeries, rsiLine;
let activePriceLines = [];   // tracked so we can remove them on each render
let currentTf     = 'daily';
let currentIdx    = null;
let allStocks     = [];
let histCache     = {};      // { ticker → { daily, weekly, daily_indicators, weekly_indicators } }
const indicators  = { ma50: true, sr: true, vp: true, fibs: true, setup: true };

// ── Chart initialisation ───────────────────────────────────────────────────
function initCharts() {
  const BASE_OPTS = {
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
    grid:   { vertLines: { color: '#1c2030' }, horzLines: { color: '#1c2030' } },
    crosshair: { mode: TV.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#363a45' },
    timeScale: { borderColor: '#363a45', timeVisible: true, secondsVisible: false },
    handleScale: { axisPressedMouseMove: { price: true, time: true } },
    handleScroll: true,
  };

  const mainEl = document.getElementById('chart-main');
  const rsiEl  = document.getElementById('chart-rsi');

  mainChart = TV.createChart(mainEl, {
    ...BASE_OPTS,
    width: mainEl.clientWidth,
    height: mainEl.clientHeight,
  });

  rsiChart = TV.createChart(rsiEl, {
    ...BASE_OPTS,
    width: rsiEl.clientWidth,
    height: 120,
    timeScale: { ...BASE_OPTS.timeScale, visible: false },
    leftPriceScale:  { visible: false },
    rightPriceScale: { ...BASE_OPTS.rightPriceScale, scaleMargins: { top: 0.05, bottom: 0.05 } },
  });

  // ── Main series ──
  candleSeries = mainChart.addCandlestickSeries({
    upColor:     '#26a69a', downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });

  ma50Line = mainChart.addLineSeries({
    color: '#f5c842', lineWidth: 2,
    priceLineVisible: false, lastValueVisible: false,
    title: 'MA50',
    crosshairMarkerVisible: false,
  });

  volSeries = mainChart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: 'vol',
    scaleMargins: { top: 0.8, bottom: 0 },
  });
  mainChart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

  // ── RSI series ──
  rsiLine = rsiChart.addLineSeries({
    color: '#9c27b0', lineWidth: 2,
    priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerVisible: false,
  });
  // Reference levels
  [70, 50, 30].forEach(lvl => {
    rsiLine.createPriceLine({
      price: lvl,
      color: lvl === 50 ? '#363a45' : lvl === 70 ? '#ef535066' : '#26a69a66',
      lineWidth: 1,
      lineStyle: LS.Dashed,
      axisLabelVisible: lvl !== 50,
      title: String(lvl),
    });
  });

  // ── Sync time scales ──
  let _syncing = false;
  mainChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (_syncing || !r) return;
    _syncing = true;
    rsiChart.timeScale().setVisibleLogicalRange(r);
    _syncing = false;
  });
  rsiChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (_syncing || !r) return;
    _syncing = true;
    mainChart.timeScale().setVisibleLogicalRange(r);
    _syncing = false;
  });

  // ── Crosshair OHLCV display ──
  mainChart.subscribeCrosshairMove(param => {
    if (!param.time) { document.getElementById('ch-ohlcv').textContent = ''; return; }
    const c = param.seriesData.get(candleSeries);
    const r = param.seriesData.get(rsiLine);
    if (c) {
      document.getElementById('ch-ohlcv').textContent =
        `O ${c.open}  H ${c.high}  L ${c.low}  C ${c.close}`;
    }
  });
  rsiChart.subscribeCrosshairMove(param => {
    const r = param.seriesData ? param.seriesData.get(rsiLine) : null;
    if (r) document.getElementById('rsi-val').textContent = r.value.toFixed(1);
  });

  // ── Responsive resize ──
  const ro = new ResizeObserver(() => {
    mainChart.resize(mainEl.clientWidth, mainEl.clientHeight);
    rsiChart.resize(rsiEl.clientWidth,  rsiEl.clientHeight);
  });
  ro.observe(mainEl);
  ro.observe(rsiEl);
}

// ── Draw technical overlays (price lines) ─────────────────────────────────
function drawOverlays(ind, stockData) {
  // Clear previous price lines
  activePriceLines.forEach(pl => { try { candleSeries.removePriceLine(pl); } catch(_) {} });
  activePriceLines = [];

  const add = (price, color, style, width, label, visible=true) => {
    if (!price || isNaN(price)) return;
    const pl = candleSeries.createPriceLine({
      price, color, lineWidth: width,
      lineStyle: style,
      axisLabelVisible: visible,
      title: label,
    });
    activePriceLines.push(pl);
  };

  const sr = ind.sr || {};
  const vp = ind.vp || {};

  // Support / Resistance zones
  if (indicators.sr) {
    (sr.supports || []).forEach((z, i) => {
      if (!z) return;
      const stars = '★'.repeat(Math.min(z.touches, 3));
      add(z.high, '#26a69a99', LS.Dashed, 1, `S ${stars}`, i === 0);
      add(z.low,  '#26a69a44', LS.Dotted, 1, '', false);
    });
    (sr.resistances || []).forEach((z, i) => {
      if (!z) return;
      const stars = '★'.repeat(Math.min(z.touches, 3));
      add(z.low,  '#ef535099', LS.Dashed, 1, `R ${stars}`, i === 0);
      add(z.high, '#ef535044', LS.Dotted, 1, '', false);
    });
  }

  // Volume Profile: POC (white solid), VAH/VAL (cyan dotted)
  if (indicators.vp && vp.poc) {
    add(vp.poc, '#ffffffcc', LS.Solid,  2, 'POC');
    add(vp.vah, '#64b5f6aa', LS.Dotted, 1, 'VAH');
    add(vp.val, '#64b5f6aa', LS.Dotted, 1, 'VAL');
  }

  // Fibonacci retracement levels (52-week high → low)
  if (indicators.fibs && ind.fibs) {
    const fibColors = {
      '0':    '#ef5350cc',
      '23.6': '#ff9800cc',
      '38.2': '#f5c842cc',
      '50.0': '#9c27b0cc',
      '61.8': '#26a69acc',
      '78.6': '#64b5f6cc',
      '100':  '#4caf50cc',
    };
    Object.entries(ind.fibs).forEach(([level, price]) => {
      add(price, fibColors[level] || '#888888cc', LS.LargeDashed, 1, `${level}%`);
    });
  }

  // Entry / Stop / Target from screener SR data
  if (indicators.setup) {
    const ns = (stockData && stockData.sr) ? stockData.sr.nearest_support   : null;
    const nr = (stockData && stockData.sr) ? stockData.sr.nearest_resistance : null;
    if (ns && ns.low) {
      const stop = +(ns.low * 0.985).toFixed(2);
      add(stop, '#ff9800', LS.Solid, 2, '⛔ Stop');
    }
    if (nr && nr.price) {
      add(nr.price, '#4caf50', LS.Dashed, 2, '🎯 Target');
    }
  }
}

// ── Render chart for a given timeframe ────────────────────────────────────
function renderChart(ticker, stockData) {
  const hist = histCache[ticker];
  if (!hist) return;
  const tf   = currentTf;
  const candles  = hist[tf];
  const ind      = hist[tf === 'daily' ? 'daily_indicators' : 'weekly_indicators'];
  if (!candles || !ind) return;

  candleSeries.setData(candles);
  ma50Line.setData(indicators.ma50 ? (ind.ma50 || []) : []);
  volSeries.setData(ind.volume || []);
  rsiLine.setData(ind.rsi   || []);
  drawOverlays(ind, stockData);
  mainChart.timeScale().fitContent();
}

// ── Load history for a ticker (cached) ────────────────────────────────────
async function loadHistory(ticker, stockData) {
  if (histCache[ticker]) {
    renderChart(ticker, stockData);
    return;
  }
  setStatus(`Loading ${ticker} chart…`);
  try {
    const res  = await fetch(`/api/history/${ticker}`);
    const data = await res.json();
    if (data.error) { setStatus(data.error); return; }
    histCache[ticker] = data;
    renderChart(ticker, stockData);
    setStatus('');
  } catch (e) {
    setStatus('Error loading chart: ' + e.message);
  }
}

// ── Select a stock from the list ──────────────────────────────────────────
async function selectStock(idx) {
  if (idx < 0 || idx >= allStocks.length) return;
  currentIdx = idx;
  const stock = allStocks[idx];

  // Highlight list item
  document.querySelectorAll('.stock-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.stock-item[data-idx="${idx}"]`);
  if (el) el.classList.add('active');

  // Update chart header
  document.getElementById('ch-ticker').textContent = stock.ticker;
  document.getElementById('ch-ticker').style.color = '';
  document.getElementById('ch-name').textContent   = stock.name;
  document.getElementById('ch-price').textContent  = stock.price ? `$${stock.price.toFixed(2)}` : '';
  document.getElementById('ch-price').style.color  = '';
  const chg = stock.change_pct;
  const chgEl = document.getElementById('ch-change');
  if (chg != null) {
    chgEl.textContent = `${chg > 0 ? '+' : ''}${chg.toFixed(2)}%`;
    chgEl.style.color = chg > 0 ? 'var(--green)' : chg < 0 ? 'var(--red)' : 'var(--txt2)';
    chgEl.style.fontWeight = '600';
    chgEl.style.fontSize = '12px';
  } else {
    chgEl.textContent = '';
  }

  renderFundamentalPanel(stock);
  await loadHistory(stock.ticker, stock);
}

// ── Left panel: fundamental data ──────────────────────────────────────────
function setupColor(label) {
  if (!label) return 'setup-neutral';
  const l = label.toUpperCase();
  if (l.includes('STRONG BUY')) return 'setup-strong';
  if (l.includes('BUY'))        return 'setup-buy';
  if (l.includes('OVERSOLD'))   return 'setup-oversold';
  if (l.includes('WATCH'))      return 'setup-watch';
  if (l.includes('EXTENDED'))   return 'setup-extended';
  return 'setup-neutral';
}

function ratingColor(r) {
  if (r >= 7) return 'var(--green)';
  if (r >= 5) return 'var(--yellow)';
  return 'var(--red)';
}

function fmtCap(cap) {
  if (!cap) return 'N/A';
  if (cap >= 1e12) return `$${(cap / 1e12).toFixed(2)}T`;
  if (cap >= 1e9)  return `$${(cap / 1e9).toFixed(2)}B`;
  if (cap >= 1e6)  return `$${(cap / 1e6).toFixed(2)}M`;
  return `$${cap}`;
}

function pct(v, decimals=1) {
  if (v == null) return 'N/A';
  return `${v > 0 ? '+' : ''}${parseFloat(v).toFixed(decimals)}%`;
}

function barHTML(val, max=5, color='var(--blue)') {
  const pct = Math.max(0, Math.min(100, val / max * 100));
  return `<div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

function infoRow(label, val, cls='') {
  if (val == null || val === '' || val === 'N/A') return '';
  return `<div class="info-row">
    <span class="info-label">${label}</span>
    <span class="info-val ${cls}">${val}</span>
  </div>`;
}

function renderFundamentalPanel(s) {
  const fd   = s.fund_details  || {};
  const td   = s.tech_details  || {};
  const info = s.info          || {};
  const sr   = s.sr            || {};
  const vp   = s.vp            || {};

  const setupCls = setupColor(s.setup_label);
  const rc       = ratingColor(s.rating);

  // EPS beat dots
  const beats = fd.eps_beats_4q;
  let beatsHTML = '';
  if (beats != null) {
    beatsHTML = Array.from({length: 4}, (_, i) =>
      `<span class="beat-dot ${i < beats ? 'hit' : 'miss'}">${i < beats ? '●' : '○'}</span>`
    ).join('') + ` <span style="color:var(--txt2)">${beats}/4</span>`;
  }

  // Entry levels
  const ns   = sr.nearest_support;
  const nr   = sr.nearest_resistance;
  const stop = ns ? (ns.low * 0.985).toFixed(2) : null;
  const rr   = (ns && nr && s.price)
    ? ((nr.price - s.price) / (s.price - stop)).toFixed(1)
    : null;

  const html = `
    <div id="company-header">
      <div class="c-ticker">${s.ticker}</div>
      <div class="c-name">${s.name}</div>
      <div class="c-price" style="color:${rc}">${s.price ? '$' + s.price.toFixed(2) : 'N/A'}</div>
      <div class="c-setup ${setupCls}">${s.setup_label || ''}</div>
    </div>

    <div class="score-wrap">
      <div class="sec-title" style="padding:0 0 6px">OVERALL RATING</div>
      <div class="overall-score" style="color:${rc}">${s.rating}<span style="font-size:16px;color:var(--txt2)">/10</span></div>
      <div class="score-row">
        <span class="score-row-label">Technical</span>
        <span class="score-row-val">${s.tech_score}</span>
        ${barHTML(s.tech_score, 5, '#2962ff')}
      </div>
      <div class="score-row">
        <span class="score-row-label">Fundamental</span>
        <span class="score-row-val">${s.fund_score}</span>
        ${barHTML(s.fund_score, 5, '#26a69a')}
      </div>
    </div>

    <div class="info-block">
      <div class="sec-title" style="padding:6px 0 4px">COMPANY</div>
      ${infoRow('Sector',     info.sector)}
      ${infoRow('Industry',   info.industry)}
      ${infoRow('Market Cap', fmtCap(info.market_cap))}
      ${infoRow('Analyst',    info.analyst ? info.analyst.toUpperCase() : null)}
    </div>

    <div class="info-block">
      <div class="sec-title" style="padding:6px 0 4px">TECHNICAL (WEEKLY)</div>
      ${infoRow('RSI (14w)',    td.weekly_rsi != null ? td.weekly_rsi.toFixed(1) : null,
          td.weekly_rsi > 70 ? 'red' : td.weekly_rsi < 30 ? 'green' : 'yellow')}
      ${infoRow('50w MA',
          td.above_weekly_ma50 != null
            ? (td.above_weekly_ma50 ? '▲ ABOVE' : '▼ BELOW') + (td.ma50_val ? ` $${td.ma50_val.toFixed(2)}` : '')
            : null,
          td.above_weekly_ma50 ? 'green' : 'red')}
      ${infoRow('MA50 Slope',  td.ma50_slope != null ? pct(td.ma50_slope, 2) : null,
          td.ma50_slope > 0 ? 'green' : 'red')}
      ${infoRow('Trend (ADX)', td.adx != null
          ? (td.bullish_trend ? '▲ UP' : '▼ DOWN') + ` (${td.adx.toFixed(1)})`
          : null,
          td.bullish_trend ? 'green' : 'red')}
      ${td.pct_from_support != null
          ? infoRow('To Support', td.pct_from_support.toFixed(1) + '%',
              td.pct_from_support <= 3 ? 'green' : td.pct_from_support <= 8 ? 'yellow' : '')
          : ''}
      ${vp.poc ? infoRow('Vol POC', '$' + vp.poc, 'cyan') : ''}
      ${vp.val && vp.vah ? infoRow('Value Area', `$${vp.val} – $${vp.vah}`, 'cyan') : ''}
    </div>

    <div class="info-block">
      <div class="sec-title" style="padding:6px 0 4px">FUNDAMENTAL</div>
      ${beatsHTML ? `<div class="info-row"><span class="info-label">EPS Beats</span><span class="info-val">${beatsHTML}</span></div>` : ''}
      ${infoRow('Revenue YoY',  fd.rev_growth_yoy != null ? pct(fd.rev_growth_yoy) : null,
          fd.rev_growth_yoy > 0 ? 'green' : 'red')}
      ${infoRow('Rev Trend',    fd.rev_qoq_trend)}
      ${infoRow('Earnings YoY', fd.earnings_growth != null ? pct(fd.earnings_growth) : null,
          fd.earnings_growth > 0 ? 'green' : 'red')}
      ${infoRow('Gross Margin', fd.gross_margin != null ? fd.gross_margin.toFixed(1) + '%' : null)}
      ${infoRow('P/E (TTM)',    info.pe != null    ? info.pe.toFixed(1)    : null)}
      ${infoRow('Forward P/E', info.forward_pe != null ? info.forward_pe.toFixed(1) : null)}
      ${infoRow('PEG',         info.peg != null
          ? info.peg.toFixed(2) : null,
          info.peg < 1 ? 'green' : info.peg > 2 ? 'red' : '')}
      ${infoRow('ROE',         info.roe != null ? pct(info.roe * 100) : null,
          info.roe > 0.20 ? 'green' : info.roe < 0 ? 'red' : '')}
      ${infoRow('Debt/Equity', info.debt_equity != null ? info.debt_equity.toFixed(2) : null,
          info.debt_equity < 0.5 ? 'green' : info.debt_equity > 2 ? 'red' : '')}
    </div>

    ${(ns || nr || stop) ? `<div class="info-block">
      <div class="sec-title" style="padding:6px 0 4px">ENTRY SETUP</div>
      ${ns ? infoRow('Support zone', `$${ns.low} – $${ns.high}  (${ns.touches}✕)`, 'green') : ''}
      ${nr ? infoRow('Resistance',   `$${nr.low} – $${nr.high}  (${nr.touches}✕)`, 'red') : ''}
      ${stop ? infoRow('Stop loss',  `$${stop}`, 'orange') : ''}
      ${nr && nr.price ? infoRow('Target', `$${nr.price.toFixed(2)}`, 'green') : ''}
      ${rr  ? infoRow('Risk / Reward', `1 : ${rr}`, parseFloat(rr) >= 2 ? 'green' : 'yellow') : ''}
    </div>` : ''}

    ${info.description ? `
    <div class="sec-title" style="padding:8px 12px 4px">ABOUT</div>
    <div class="description">${info.description}${info.description.length === 400 ? '…' : ''}</div>` : ''}
  `;

  const lc = document.getElementById('left-content');
  lc.innerHTML = html;
  lc.style.display = 'flex';
  document.getElementById('left-placeholder').style.display = 'none';
}

// ── Right panel: sector info + stock list ─────────────────────────────────
function renderRightPanel(sectorData, stocks) {
  const sent = sectorData.sentiment || {};
  const d    = sent.details || {};

  const sentColors = {
    'STRONGLY BULLISH': 'var(--green)',
    'BULLISH':          'var(--green2)',
    'NEUTRAL / MIXED':  'var(--yellow)',
    'BEARISH':          'var(--red)',
    'STRONGLY BEARISH': '#c62828',
  };
  const sentIcons = {
    'STRONGLY BULLISH': '▲▲',
    'BULLISH':          '▲',
    'NEUTRAL / MIXED':  '◆',
    'BEARISH':          '▼',
    'STRONGLY BEARISH': '▼▼',
  };
  const sc = sentColors[sent.label] || 'var(--txt2)';
  const si = sentIcons[sent.label]  || '◆';

  const etfRsi    = d.etf_rsi   != null ? d.etf_rsi   : '—';
  const ma50txt   = d.etf_above_ma50 ? '▲ Above' : '▼ Below';
  const mom       = d.etf_momentum_13w != null ? `${d.etf_momentum_13w > 0 ? '+' : ''}${d.etf_momentum_13w}%` : '—';
  const breadth   = d.breadth_above_ma50 != null ? d.breadth_above_ma50 + '%' : '—';
  const trend     = d.etf_trend || '—';
  const adx       = d.etf_adx   != null ? d.etf_adx : '—';

  document.getElementById('sector-header').innerHTML = `
    <div class="s-etf">${sectorData.etf}</div>
    <div class="s-name">${sectorData.name}</div>
    <div class="s-sentiment" style="color:${sc}">${si} ${sent.label}
      <span class="s-score">(${sent.score > 0 ? '+' : ''}${sent.score})</span>
    </div>
    <div class="metric-grid">
      <div class="metric">
        <div class="metric-val" style="color:${parseFloat(etfRsi) > 70 ? 'var(--red)' : parseFloat(etfRsi) < 30 ? 'var(--green)' : 'var(--txt)'}">${etfRsi}</div>
        <div class="metric-label">ETF RSI</div>
      </div>
      <div class="metric">
        <div class="metric-val" style="color:${d.etf_above_ma50 ? 'var(--green)' : 'var(--red)'}">${ma50txt}</div>
        <div class="metric-label">vs MA50</div>
      </div>
      <div class="metric">
        <div class="metric-val" style="color:${parseFloat(mom) > 0 ? 'var(--green)' : 'var(--red)'}">${mom}</div>
        <div class="metric-label">13w Mom.</div>
      </div>
      <div class="metric">
        <div class="metric-val">${breadth}</div>
        <div class="metric-label">Breadth</div>
      </div>
      <div class="metric" style="grid-column:span 2">
        <div class="metric-val" style="font-size:11px">${trend} · ADX ${adx}</div>
        <div class="metric-label">ETF Trend</div>
      </div>
    </div>
  `;
  document.getElementById('sector-header').style.display = 'block';

  // Stock list
  const listEl = document.getElementById('stock-list');
  listEl.innerHTML = stocks.map((s, i) => {
    const cls = setupColor(s.setup_label);
    const rc  = ratingColor(s.rating);
    const shortSetup = (s.setup_label || '').replace('— BOUNCE WATCH','').replace('— WAIT FOR PULLBACK','').trim();
    const chg = s.change_pct;
    const chgColor = chg == null ? '' : chg > 0 ? 'var(--green)' : chg < 0 ? 'var(--red)' : 'var(--txt2)';
    const chgText  = chg == null ? '' : `${chg > 0 ? '+' : ''}${chg.toFixed(2)}%`;
    return `<div class="stock-item" data-idx="${i}" onclick="selectStock(${i})">
      <span class="si-rank">${i + 1}</span>
      <div class="si-body">
        <div class="si-top">
          <span class="si-ticker">${s.ticker}</span>
          <span class="si-price">${s.price ? '$' + s.price.toFixed(2) : ''}</span>
          ${chgText ? `<span class="si-change" style="color:${chgColor}">${chgText}</span>` : ''}
        </div>
        <div class="si-bot">
          <span class="si-setup ${cls}">${shortSetup}</span>
          <span class="si-rating" style="color:${rc}">${s.rating}/10</span>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('stocks-title').textContent  = `STOCKS (${stocks.length})`;
  document.getElementById('stocks-title').style.display = 'block';
  listEl.style.display = 'block';
  document.getElementById('right-placeholder').style.display = 'none';
}

// ── Scan sector ────────────────────────────────────────────────────────────
async function scanSector() {
  const etf = document.getElementById('etf-input').value.trim().toUpperCase();
  if (!etf) return;

  histCache  = {};
  allStocks  = [];
  currentIdx = null;

  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  setStatus(`<span class="spinner"></span> Scanning ${etf} …`);

  // Reset panels
  document.getElementById('left-placeholder').style.display = 'flex';
  document.getElementById('left-content').style.display     = 'none';
  document.getElementById('right-placeholder').style.display = 'flex';
  document.getElementById('sector-header').style.display     = 'none';
  document.getElementById('stocks-title').style.display      = 'none';
  document.getElementById('stock-list').style.display        = 'none';
  document.getElementById('ch-ticker').textContent  = '—';
  document.getElementById('ch-name').textContent    = '';
  document.getElementById('ch-price').textContent   = '';
  candleSeries && candleSeries.setData([]);
  ma50Line     && ma50Line.setData([]);
  volSeries    && volSeries.setData([]);
  rsiLine      && rsiLine.setData([]);
  activePriceLines.forEach(pl => { try { candleSeries.removePriceLine(pl); } catch(_) {} });
  activePriceLines = [];

  try {
    const res  = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ etf }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      setStatus(`Error: ${data.error || res.statusText}`);
      return;
    }
    allStocks = data.stocks;
    renderRightPanel(data.sector, data.stocks);
    setStatus(`${data.stocks.length} stocks analysed`);
    if (data.stocks.length) selectStock(0);
  } catch (e) {
    setStatus('Network error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ── Utilities ──────────────────────────────────────────────────────────────
function setStatus(msg) {
  document.getElementById('scan-status').innerHTML = msg;
}

// ── Wiring ─────────────────────────────────────────────────────────────────
document.getElementById('scan-btn').addEventListener('click', scanSector);
document.getElementById('etf-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') scanSector();
});

document.querySelectorAll('.ind-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.ind;
    indicators[key] = !indicators[key];
    btn.classList.toggle('active', indicators[key]);
    if (currentIdx !== null && allStocks[currentIdx]) {
      const s = allStocks[currentIdx];
      if (histCache[s.ticker]) renderChart(s.ticker, s);
    }
  });
});

document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTf = btn.dataset.tf;
    if (currentIdx !== null && allStocks[currentIdx]) {
      const s = allStocks[currentIdx];
      if (histCache[s.ticker]) renderChart(s.ticker, s);
      else loadHistory(s.ticker, s);
    }
  });
});

// ── Boot ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', initCharts);
</script>
